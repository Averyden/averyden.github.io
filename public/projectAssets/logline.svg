<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="ll-title">
  <title id="ll-title">logline — terminal prompt with blinking cursor</title>

  <!-- badge -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#0d0d0d" stroke="#41ff41" stroke-opacity="0.35" stroke-width="2"/>

  <!-- previous log lines, faded into history -->
  <rect x="12" y="12" width="30" height="4" rx="2" fill="#ffbd2e" opacity="0.55"/>
  <rect x="12" y="20" width="20" height="4" rx="2" fill="#ff5f56" opacity="0.5"/>

  <!-- the prompt -->
  <path d="M15 30 L32 44 L15 58" fill="none" stroke="#41ff41" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- cursor, actually blinking -->
  <style>
    .cursor { animation: ll-blink 1.2s steps(1) infinite; }
    @keyframes ll-blink { 50% { opacity: 0; } }
  </style>
  <rect x="38" y="50" width="18" height="8" fill="#41ff41" class="cursor"/>
</svg>
